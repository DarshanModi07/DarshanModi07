name: 3D Contribution Skyline

on:
  schedule:
    - cron: "30 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate 3D contribution skyline
        uses: yoshi389111/github-profile-3d-contrib@0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Rotate skyline theme
        shell: bash
        run: |
          themes=(
            "profile-night-rainbow.svg"
            "profile-green-animate.svg"
            "profile-green.svg"
            "profile-season-animate.svg"
            "profile-season.svg"
            "profile-south-season-animate.svg"
            "profile-south-season.svg"
            "profile-night-view.svg"
            "profile-night-green.svg"
            "profile-gitblock.svg"
          )

          state_file=".github/skyline-theme-index"

          if [ -f "$state_file" ]; then
            current_index=$(cat "$state_file")
          else
            current_index=0
          fi

          if ! [[ "$current_index" =~ ^[0-9]+$ ]]; then
            current_index=0
          fi

          theme="${themes[$current_index]}"

          echo "Current theme index: $current_index"
          echo "Selected skyline theme: $theme"

          sed -i -E 's#\./profile-3d-contrib/[^"'\'' ]+\.svg#./profile-3d-contrib/'"$theme"'#' README.md

          next_index=$(( (current_index + 1) % ${#themes[@]} ))

          echo "$next_index" > "$state_file"

          echo "Next theme index: $next_index"

      - name: Commit and push changes
        shell: bash
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "chore: rotate 3D contribution skyline"
          git push

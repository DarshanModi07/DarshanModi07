name: 3D Contribution Skyline

on:
  schedule:
    # Every night at 12:00 AM IST (18:30 UTC)
    - cron: "30 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate 3D contribution skyline
        uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Rotate skyline theme
        shell: bash
        run: |
          set -e

          themes=(
            "profile-night-rainbow.svg"
            "profile-green-animate.svg"
            "profile-green.svg"
            "profile-season-animate.svg"
            "profile-season.svg"
            "profile-south-season-animate.svg"
            "profile-south-season.svg"
            "profile-night-view.svg"
            "profile-night-green.svg"
            "profile-gitblock.svg"
          )

          state_file=".github/skyline-theme-index"
          readme_file="README.md"

          if [ -f "$state_file" ]; then
            current_index="$(cat "$state_file")"
          else
            current_index=0
          fi

          if ! [[ "$current_index" =~ ^[0-9]+$ ]]; then
            current_index=0
          fi

          theme="${themes[$current_index]}"
          next_index=$(( (current_index + 1) % ${#themes[@]} ))

          echo "Current theme: $theme"
          echo "Next theme index: $next_index"

          # Update only the existing 3D skyline image reference in README.md.
          sed -i -E \
            's#\./profile-3d-contrib/[^"[:space:]]+\.svg#./profile-3d-contrib/'"$theme"'#' \
            "$readme_file"

          # Save the next theme index.
          printf '%s\n' "$next_index" > "$state_file"

          # Stage only files relevant to the rotation.
          git add "$readme_file" "$state_file" "profile-3d-contrib/$theme"

      - name: Commit and push only when needed
        shell: bash
        run: |
          set -e

          if git diff --cached --quiet; then
            echo "No skyline changes. Nothing to commit."
            exit 0
          fi

          # GitHub Actions bot identity.
          # Do not use your personal GitHub email here.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git commit -m "chore: update 3D contribution skyline"
          git push
